name: NodeJS Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # package.json requires node >=20; jsdom/vitest/esbuild/@csstools no longer run on 16
        node-version: [22.x]

    steps:
      # survey-pdf depends on "../survey-library/packages/survey-core/build",
      # so both repos are checked out side by side inside the workspace
      - name: Checkout survey-pdf
        uses: actions/checkout@v4
        with:
          path: survey-pdf

      - name: Checkout survey-library
        uses: actions/checkout@v4
        with:
          repository: surveyjs/survey-library
          ref: master
          path: survey-library

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build survey-core
        working-directory: survey-library
        run: |
          npm install --ignore-scripts
          cd packages/survey-core
          npm install
          npm run build

      - name: Build survey-pdf
        working-directory: survey-pdf
        run: |
          npm ci
          npm run build
          npm run build:fonts
