name: API gap
description: You had to work around SurveyJS PDF Generator in your application code. Tell us which API you expected instead.
title: "[API gap] "
labels: ["api-gap", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        SurveyJS adds small API improvements (a property, an event, an option) quickly, often in the next weekly release.
        Please don't include application code beyond the workaround, credentials or real data.
        Form Library issues go to https://github.com/surveyjs/survey-library/issues.
  - type: input
    id: version
    attributes:
      label: Package and version
      description: For example, survey-pdf 3.2.7, survey-core 3.2.7 and jspdf 4.2.1.
      placeholder: survey-pdf 3.2.7, survey-core 3.2.7, jspdf 4.2.1
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you needed
      description: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: The workaround you wrote
      description: Private members, prototype patches of flat or brick classes, post-processing the generated jsPDF document, drawing over the layout to hide or replace built-in content, and so on.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected-api
    attributes:
      label: The API you expected
      description: A property, an event, a method or an option, and how you would call it.
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Minimal survey JSON
      description: The smallest survey JSON that shows the case. Add survey data and PDF options if they matter.
      render: json
    validations:
      required: false
